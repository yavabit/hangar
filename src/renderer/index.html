<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <title>Hangar</title>
    <!-- https://developer.mozilla.org/en-US/docs/Web/HTTP/CSP -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:"
    />
    <style>
      :root {
        --splash-bg: #eceff4;
        --splash-glow-1: rgba(108, 128, 186, 0.42);
        --splash-glow-2: rgba(124, 124, 240, 0.24);
        --splash-title: #141821;
        --splash-text: #5b6272;
        --splash-track: rgba(81, 80, 216, 0.14);
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --splash-bg: #0b0c10;
          --splash-glow-1: rgba(99, 102, 241, 0.22);
          --splash-glow-2: rgba(56, 96, 170, 0.24);
          --splash-title: #ecedef;
          --splash-text: #8b8f98;
          --splash-track: rgba(139, 139, 255, 0.16);
        }
      }

      html,
      body {
        margin: 0;
        background: var(--splash-bg);
      }

      .splash {
        position: fixed;
        inset: 0;
        z-index: 2000;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        background:
          radial-gradient(55% 45% at 55% -8%, var(--splash-glow-1), transparent 72%),
          radial-gradient(38% 40% at 100% 18%, var(--splash-glow-2), transparent 70%),
          var(--splash-bg);
        font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
        -webkit-app-region: drag;
        transition:
          opacity 0.45s ease,
          transform 0.45s ease;
      }

      .splash--hidden {
        opacity: 0;
        transform: scale(1.03);
        pointer-events: none;
      }

      .splash__logo {
        width: 92px;
        height: 92px;
        filter: drop-shadow(0 16px 32px rgba(111, 111, 240, 0.35));
        animation:
          splash-in 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) both,
          splash-float 2.4s ease-in-out 0.6s infinite;
      }

      .splash__title {
        margin-top: 8px;
        font-size: 26px;
        font-weight: 600;
        letter-spacing: -0.02em;
        color: var(--splash-title);
        animation: splash-in 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) 0.1s both;
      }

      .splash__status {
        font-size: 13px;
        color: var(--splash-text);
        animation: splash-in 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) 0.2s both;
      }

      .splash__progress {
        position: relative;
        width: 160px;
        height: 3px;
        overflow: hidden;
        border-radius: 3px;
        background: var(--splash-track);
        animation: splash-in 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) 0.2s both;
      }

      .splash__progress::after {
        content: '';
        position: absolute;
        top: 0;
        bottom: 0;
        left: -40%;
        width: 40%;
        border-radius: 3px;
        background: linear-gradient(90deg, #7474f5, #b6b6ff);
        animation: splash-progress 1.1s ease-in-out infinite;
      }

      @keyframes splash-in {
        from {
          opacity: 0;
          transform: translateY(10px) scale(0.96);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }

      @keyframes splash-float {
        0%,
        100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-6px);
        }
      }

      @keyframes splash-progress {
        from {
          left: -40%;
        }
        to {
          left: 100%;
        }
      }
    </style>
  </head>

  <body>
    <div id="splash" class="splash" role="status" aria-live="polite">
      <img class="splash__logo" src="/src/shared/assets/logo/logo.svg" alt="" />
      <div class="splash__title">Hangar</div>
      <div class="splash__progress"></div>
      <div class="splash__status">Выкатываем проекты…</div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
